# infer 容器配置：外部项目迁移随机动作示例
#
# 这个示例演示选手把一个外部算法项目文件夹迁移进仓库后，
# 通过 adapter_class 接入 GHRC 评测接口。

# ---- 任务选择 ----
task: task4
task_text: null
task_config_path: null
# max_steps: 2000

# ---- 设备 ----
device: cpu

# ---- 外部项目 Adapter ----
adapter_type: lerobot
adapter_class: external_policy_examples.random_action_project.ghrc_adapter:ExternalRandomPolicyAdapter
adapter_config:
  action_dim: 20
  action_low: -1.0
  action_high: 1.0
  seed: 2026

# adapter_class 已设置，本示例不需要 LeRobot policy 权重
policy_type: null
policy_path: null

# ---- WebSocket 服务（infer 监听端）----
websocket_server_host: 0.0.0.0
websocket_control_port: 8765
websocket_stream_port: 8766
heartbeat_interval: 5.0
connection_timeout: 30.0
websocket_max_size_bytes: null

# infer 容器配置：零动作自定义 policy 示例
#
# 依据:
# - src/lerobot/scripts/ghrc_eval_infer.py
# - src/lerobot/sim_eval/zero_action_policy.py
#
# 标记说明同 eval_infer.yaml。
# 不允许修改 src/lerobot/sim_eval 下的协议、断言、通信和评分源码。

# ---- 任务选择 ----
task: task4                         # [必填] task1 / task2 / task3 / task4；会被 CLI --task 覆盖
task_text: null                     # [可选] 任务自然语言描述；null 时使用内置 TASK_DEFAULT_TEXT
task_config_path: null              # [可选] 任务 YAML 路径；null 时按 task 使用内置默认路径
# max_steps: 2000                   # [可选] 单个 episode 最大步数；不写时 task1-3=10000, task4=2000
                                    #        不要写 null；源码会执行 int(max_steps)

# ---- 设备 ----
device: cuda:0                         # [可选] 零动作示例不使用 GPU，cpu 即可

# ---- 自定义策略适配器 ----
adapter_type: lerobot               # [可选] adapter_class 存在时仅作为回退字段
adapter_class: src.lerobot.sim_eval.zero_action_policy:ZeroActionPolicyAdapter  # [必填] 零动作示例适配器
adapter_config:                     # [可选] 传入 ZeroActionPolicyAdapter.load() 的参数
  action_dim: 20                    # [可选] action 维度；默认 20；task4 输出 18 时 sim 侧也会补到 20

# ---- LeRobot 策略（本示例不生效）----
policy_type: null                   # [可选] adapter_class 已设置，因此不需要 policy_type
policy_path: null                   # [可选] adapter_class 已设置，因此不需要模型权重路径

# ---- WebSocket 服务（infer 监听端）----
websocket_server_host: 0.0.0.0      # [可选][通常不改] infer 服务监听地址
websocket_control_port: 8765        # [可选][联动] 控制通道端口；需等于 sim_infer_control_port
websocket_stream_port: 8766         # [可选][联动] 数据流端口；需等于 sim_infer_stream_port
heartbeat_interval: 5.0             # [可选][联动] 心跳间隔，秒
connection_timeout: 30.0            # [可选][联动] 连接超时，秒
websocket_max_size_bytes: null      # [可选][联动] 单条 WebSocket 消息最大字节数；null 为不限制
